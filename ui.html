<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8" />
<style>
  :root {
    --ink: #1e1e1e;
    --muted: #8c8c8c;
    --border: #e6e6e6;
    --bg: #ffffff;
    --panel: #f5f5f5;
    --accent: #7b61ff;
    --danger: #e05252;
    --danger-bg: #fdeceb;
    --warn: #b8860b;
    --warn-bg: #fbf3e0;
    --ok-bg: #f0f0f0;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, sans-serif;
    font-size: 12px;
    color: var(--ink);
    background: var(--bg);
    display: flex;
    flex-direction: column;
    height: 100vh;
  }
  header {
    padding: 12px 14px 10px;
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-shrink: 0;
  }
  #live-dot {
    display: inline-block;
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: var(--muted);
    margin-right: 5px;
    transition: background 0.2s;
  }
  #live-dot.pulse { background: #3bb273; }
  #search {
    width: 100%;
    font-family: inherit;
    font-size: 11px;
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 6px 8px;
    margin: 0;
  }
  header h1 {
    font-size: 13px;
    font-weight: 600;
    margin: 0;
  }
  header p {
    margin: 2px 0 0;
    font-size: 11px;
    color: var(--muted);
  }
  button {
    font-family: inherit;
    font-size: 11px;
    border: 1px solid var(--border);
    background: var(--bg);
    border-radius: 6px;
    padding: 5px 10px;
    cursor: pointer;
    color: var(--ink);
  }
  button:hover { background: var(--panel); }
  button.primary {
    background: var(--accent);
    border-color: var(--accent);
    color: white;
  }
  button.primary:hover { opacity: 0.9; }
  #list {
    flex: 1;
    overflow-y: auto;
    padding: 8px 10px;
  }
  .row {
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 8px 10px;
    margin-bottom: 6px;
  }
  .row-top {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
  }
  .row-name {
    font-weight: 500;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .count {
    font-variant-numeric: tabular-nums;
    color: var(--muted);
    flex-shrink: 0;
  }
  .badge {
    display: inline-block;
    font-size: 10px;
    font-weight: 600;
    padding: 1px 6px;
    border-radius: 999px;
    margin-right: 6px;
    letter-spacing: 0.02em;
  }
  .badge.missing { color: var(--danger); background: var(--danger-bg); }
  .badge.deprecated { color: var(--warn); background: var(--warn-bg); }
  .reason {
    margin-top: 4px;
    color: var(--muted);
    font-style: italic;
  }
  .row-actions {
    margin-top: 6px;
    display: flex;
    flex-wrap: wrap;
    gap: 4px;
  }
  .row-actions button { font-size: 10px; padding: 3px 8px; }
  .empty {
    padding: 24px 14px;
    color: var(--muted);
    text-align: center;
  }
  #selection-panel {
    border-top: 1px solid var(--border);
    padding: 10px 14px;
    flex-shrink: 0;
    background: var(--panel);
  }
  #selection-panel.hidden { display: none; }
  #selection-panel .sel-name {
    font-weight: 600;
    margin-bottom: 6px;
  }
  #selection-panel textarea {
    width: 100%;
    font-family: inherit;
    font-size: 11px;
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 5px 7px;
    resize: vertical;
    min-height: 32px;
    margin: 6px 0;
  }
  .toggle-row {
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .toggle-row label { display: flex; align-items: center; gap: 6px; cursor: pointer; }
</style>
</head>
<body>
  <header>
    <div>
      <h1>Component Sentinel</h1>
      <p id="subtitle"><span id="live-dot"></span><span id="subtitle-text">Scanning file…</span></p>
    </div>
    <div style="display:flex; gap:6px;">
      <button id="debug">Debug</button>
      <button id="rescan">Rescan</button>
    </div>
  </header>

  <pre id="debug-output" style="display:none; margin:0; padding:10px 14px; font-size:10px; white-space:pre-wrap; overflow-y:auto; max-height:220px; border-bottom:1px solid var(--border); background:#0f0f0f; color:#8fe38f;"></pre>

  <div style="display:flex; align-items:center; gap:8px; padding:8px 14px; border-bottom:1px solid var(--border);">
    <button id="copy-md">Copy report as Markdown</button>
    <button id="copy-json">Copy as JSON</button>
    <span id="copy-status" style="color:var(--muted); font-size:11px;"></span>
  </div>

  <div style="padding:8px 14px; border-bottom:1px solid var(--border);">
    <input id="search" type="text" placeholder="Filter by component name…" />
  </div>

  <div id="list"><div class="empty">Scanning the whole file — this can take a moment on large files.</div></div>

  <div id="selection-panel" class="hidden">
    <div class="sel-name" id="sel-name"></div>
    <div class="toggle-row">
      <label><input type="checkbox" id="sel-deprecated" /> Mark as deprecated</label>
    </div>
    <textarea id="sel-reason" placeholder="Optional note — e.g. &quot;replaced by Button v2&quot;"></textarea>
    <button class="primary" id="sel-save">Save</button>
  </div>

<script>
  const list = document.getElementById('list')
  const subtitle = document.getElementById('subtitle-text')
  const liveDot = document.getElementById('live-dot')
  const searchInput = document.getElementById('search')
  const selectionPanel = document.getElementById('selection-panel')
  const selName = document.getElementById('sel-name')
  const selDeprecated = document.getElementById('sel-deprecated')
  const selReason = document.getElementById('sel-reason')
  let currentSelectionNodeId = null
  let lastRows = []

  function post(msg) { parent.postMessage({ pluginMessage: msg }, '*') }

  function copyText(text) {
    const done = () => {
      const status = document.getElementById('copy-status')
      status.textContent = 'Copied!'
      setTimeout(() => { status.textContent = '' }, 2000)
    }
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text).then(done).catch(() => fallbackCopy(text, done))
    } else {
      fallbackCopy(text, done)
    }
  }

  function fallbackCopy(text, done) {
    const ta = document.createElement('textarea')
    ta.value = text
    ta.style.position = 'fixed'
    ta.style.opacity = '0'
    document.body.appendChild(ta)
    ta.focus()
    ta.select()
    try { document.execCommand('copy') } catch (e) {}
    document.body.removeChild(ta)
    done()
  }

  function statusBadgeText(status) {
    if (status === 'missing') return '\u{1F534} MISSING'
    if (status === 'deprecated') return '\u{1F7E1} DEPRECATED'
    return '✅ OK'
  }

  function rowToMarkdown(row) {
    const lines = [`### ${row.name} — ${statusBadgeText(row.status)} (${row.count}×)`]
    if (row.reason) lines.push(`_${row.reason}_`)
    row.pages.forEach((p) => {
      const label = `${p.pageName} (${p.nodeIds.length}×)`
      lines.push(p.url ? `- [${label}](${p.url})` : `- ${label}`)
    })
    lines.push('')
    return lines
  }

  function buildMarkdown(rows) {
    const lines = ['# Component Sentinel Report', '']
    const flagged = rows.filter((r) => r.status !== 'ok')
    const ok = rows.filter((r) => r.status === 'ok')
    if (flagged.length) {
      lines.push('## Needs attention', '')
      flagged.forEach((r) => lines.push(...rowToMarkdown(r)))
    }
    if (ok.length) {
      lines.push('## Healthy components', '')
      ok.forEach((r) => lines.push(...rowToMarkdown(r)))
    }
    return lines.join('\n')
  }

  document.getElementById('copy-md').onclick = () => copyText(buildMarkdown(lastRows))
  document.getElementById('copy-json').onclick = () => copyText(JSON.stringify(lastRows, null, 2))

  document.getElementById('rescan').onclick = () => {
    subtitle.textContent = 'Scanning file…'
    post({ type: 'scan' })
  }

  document.getElementById('debug').onclick = () => {
    post({ type: 'debug' })
  }

  document.getElementById('sel-save').onclick = () => {
    if (!currentSelectionNodeId) return
    post({
      type: 'set-deprecated',
      nodeId: currentSelectionNodeId,
      deprecated: selDeprecated.checked,
      reason: selReason.value.trim(),
    })
  }

  function statusBadge(status) {
    if (status === 'missing') return '<span class="badge missing">MISSING</span>'
    if (status === 'deprecated') return '<span class="badge deprecated">DEPRECATED</span>'
    return ''
  }

  function render(rows) {
    lastRows = rows
    if (!rows.length) {
      list.innerHTML = '<div class="empty">No component instances found in this file.</div>'
      subtitle.textContent = 'Nothing to report'
      return
    }
    const flagged = rows.filter((r) => r.status !== 'ok')
    const flaggedInstances = flagged.reduce((n, r) => n + r.count, 0)
    subtitle.textContent = `${rows.length} component${rows.length === 1 ? '' : 's'} in use` +
      (flagged.length
        ? ` — ${flaggedInstances} instance${flaggedInstances === 1 ? '' : 's'} across ${flagged.length} need attention`
        : ' — all clear')

    renderList()
  }

  function renderList() {
    const query = searchInput.value.trim().toLowerCase()
    const rows = query ? lastRows.filter((r) => r.name.toLowerCase().includes(query)) : lastRows

    if (!rows.length) {
      list.innerHTML = '<div class="empty">No components match that filter.</div>'
      return
    }

    list.innerHTML = rows.map((row) => {
      const totalPages = row.pages.length
      const first = row.pages[0]
      const otherCount = row.pages.slice(1).reduce((n, p) => n + p.nodeIds.length, 0)
      const actions = row.pages.slice(0, 4).map((p) => {
        const label = totalPages > 1 ? `Select on "${p.pageName}"` : 'Select all'
        return `<button data-page="${p.pageId}" data-nodes='${JSON.stringify(p.nodeIds)}'>${escapeHtml(label)}</button>`
      }).join('')

      return `
        <div class="row">
          <div class="row-top">
            <span class="row-name">${statusBadge(row.status)}${escapeHtml(row.name)}</span>
            <span class="count">${row.count}×</span>
          </div>
          ${row.reason ? `<div class="reason">${escapeHtml(row.reason)}</div>` : ''}
          <div class="row-actions">${actions}</div>
        </div>
      `
    }).join('')

    list.querySelectorAll('button[data-page]').forEach((btn) => {
      btn.addEventListener('click', () => {
        post({
          type: 'select',
          pageId: btn.getAttribute('data-page'),
          nodeIds: JSON.parse(btn.getAttribute('data-nodes')),
        })
      })
    })
  }

  function escapeHtml(s) {
    return String(s).replace(/[&<>"']/g, (c) => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))
  }

  searchInput.addEventListener('input', renderList)

  let liveDotTimer = null
  function pulseLiveDot() {
    liveDot.classList.add('pulse')
    if (liveDotTimer) clearTimeout(liveDotTimer)
    liveDotTimer = setTimeout(() => liveDot.classList.remove('pulse'), 800)
  }

  window.onmessage = (event) => {
    const msg = event.data.pluginMessage
    if (!msg) return
    if (msg.type === 'scan-result') {
      render(msg.rows)
      if (msg.live) pulseLiveDot()
    }
    if (msg.type === 'debug-result') {
      const out = document.getElementById('debug-output')
      out.style.display = 'block'
      out.textContent = msg.text
    }
    if (msg.type === 'selection-component') {
      if (!msg.node) {
        selectionPanel.classList.add('hidden')
        currentSelectionNodeId = null
        return
      }
      currentSelectionNodeId = msg.node.id
      selName.textContent = msg.node.name
      selDeprecated.checked = msg.node.deprecated
      selReason.value = msg.node.reason || ''
      selectionPanel.classList.remove('hidden')
    }
  }

  post({ type: 'scan' })
  post({ type: 'get-selection-component' })
</script>
</body>
</html>
